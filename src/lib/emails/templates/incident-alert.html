<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f8fafc;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
    <tr>
      <td style="background: linear-gradient(135deg, #dc2626 0%, #f59e0b 100%); padding: 40px 32px; text-align: center;">
        <img src="https://elimunova.ai/logo-white.png" alt="ElimuNova AI" style="height: 48px; margin-bottom: 16px;">
        <h1 style="color: #ffffff; margin: 0; font-size: 28px; font-weight: 700;">System Incident Alert</h1>
      </td>
    </tr>
    <tr>
      <td style="padding: 40px 32px;">
        <p style="font-size: 18px; color: #1e293b; margin: 0 0 16px; line-height: 1.6;">Hi {{firstName}},</p>
        <p style="font-size: 16px; color: #475569; margin: 0 0 24px; line-height: 1.6;">
          The ElimuNova AI health agent detected an incident that needs your attention.
        </p>
        <div style="background: #fef2f2; border-radius: 8px; padding: 24px; margin: 24px 0; border: 1px solid #fecaca;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr><td style="padding: 8px 0; color: #991b1b;">Severity</td><td style="padding: 8px 0; font-weight: 700; color: #dc2626; text-align: right;">{{severity}}</td></tr>
            <tr><td style="padding: 8px 0; color: #991b1b;">Title</td><td style="padding: 8px 0; font-weight: 600; color: #1e293b; text-align: right;">{{incidentTitle}}</td></tr>
          </table>
        </div>
        <p style="font-size: 16px; color: #1e293b; margin: 0 0 24px; line-height: 1.6; font-weight: 600;">Details</p>
        <p style="font-size: 15px; color: #475569; margin: 0 0 24px; line-height: 1.7;">{{incidentMessage}}</p>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td align="center">
              <a href="/super-admin/incidents" style="background: linear-gradient(135deg, #dc2626 0%, #f59e0b 100%); color: #ffffff; text-decoration: none; padding: 14px 28px; border-radius: 8px; font-weight: 600; font-size: 16px; display: inline-block;">View Incidents</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="background-color: #f8fafc; padding: 24px 32px; text-align: center; border-top: 1px solid #e2e8f0;">
        <p style="font-size: 12px; color: #94a3b8; margin: 0;">© {{year}} ElimuNova AI. All rights reserved.</p>
      </td>
    </tr>
  </table>
</body>
</html>
