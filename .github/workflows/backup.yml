# Automated Database Backup â€” runs daily at 2 AM UTC.
# Uses pg_dump (custom format) and stores as GitHub artifact.
# Retention: 90 days. Old artifacts auto-cleaned.
#
# Manual trigger: GitHub UI â†’ Actions â†’ Database Backup â†’ Run workflow
#
# Prerequisite: Add a DIRECT (non-pooler) database URL to GitHub secrets.
#   Settings â†’ Secrets and variables â†’ Actions â†’ Add BACKUP_DATABASE_URL
#
# IMPORTANT: pg_dump does NOT work against the PgBouncer pooled (-pooler)
# endpoint that the app uses. Use the direct Neon connection string
# (same host without "-pooler"). Falls back to DATABASE_URL if
# BACKUP_DATABASE_URL is not set.
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'   # Daily at 2 AM UTC
  workflow_dispatch:       # Manual trigger

env:
  NODE_VERSION: '20'

jobs:
  backup:
    name: pg_dump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Verify database URL is configured
        run: |
          if [ -z "${{ secrets.BACKUP_DATABASE_URL || secrets.DATABASE_URL }}" ]; then
            echo "::error::No database URL configured. Add BACKUP_DATABASE_URL (direct, non-pooler Neon URL) to repository secrets."
            exit 1
          fi

      - name: Run pg_dump
        run: |
          TIMESTAMP=$(date +%Y-%m-%dT%H-%M-%S)
          FILENAME="elimunova-backup-${TIMESTAMP}.sql"
          pg_dump "${{ secrets.BACKUP_DATABASE_URL || secrets.DATABASE_URL }}" \
            --no-owner \
            --no-acl \
            --format=custom \
            --file="${FILENAME}"
          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90

  cleanup:
    name: Clean old backups
    runs-on: ubuntu-latest
    needs: [backup]
    steps:
      - name: Delete backups older than 90 days
        uses: actions/github-script@v7
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.name,
            });
            const cutoff = Date.now() - 90 * 24 * 60 * 60 * 1000;
            for (const artifact of artifacts.artifacts) {
              if (new Date(artifact.created_at).getTime() < cutoff) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.name,
                  artifact_id: artifact.id,
                });
              }
            }
