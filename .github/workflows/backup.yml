# Automated Database Backup â€” runs daily at 2 AM UTC.
# Uses pg_dump (custom format) and stores as GitHub artifact.
# Retention: 90 days. Old artifacts auto-cleaned.
#
# Manual trigger: GitHub UI â†’ Actions â†’ Database Backup â†’ Run workflow
#
# Prerequisite: Add a DIRECT (non-pooler) database URL to GitHub secrets.
#   Settings â†’ Secrets and variables â†’ Actions â†’ Add BACKUP_DATABASE_URL
#
# IMPORTANT: pg_dump does NOT work against the PgBouncer pooled (-pooler)
# endpoint that the app uses. Use the direct Neon connection string
# (same host without "-pooler"). Falls back to DATABASE_URL if
# BACKUP_DATABASE_URL is not set.
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'   # Daily at 2 AM UTC
  workflow_dispatch:       # Manual trigger

env:
  NODE_VERSION: '20'

jobs:
  backup:
    name: pg_dump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PostgreSQL client (matching server major)
        run: |
          # Neon runs PostgreSQL 18; Ubuntu's repo only ships client 16 and
          # pg_dump refuses to dump a server newer than itself. Pull the
          # matching client from the official PGDG apt repo.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          pg_dump --version

      - name: Verify database URL is configured
        run: |
          if [ -z "${{ secrets.BACKUP_DATABASE_URL || secrets.DATABASE_URL }}" ]; then
            echo "::error::No database URL configured. Add BACKUP_DATABASE_URL (direct, non-pooler Neon URL) to repository secrets."
            exit 1
          fi

      - name: Run pg_dump
        run: |
          # Strip any stray newlines from the secret so the connection string
          # stays a single clean value (a trailing \n breaks sslmode parsing).
          DB_URL="$(printf '%s' "${{ secrets.BACKUP_DATABASE_URL || secrets.DATABASE_URL }}" | tr -d '\r\n')"
          if [ -z "$DB_URL" ]; then
            echo "::error::No database URL configured. Add BACKUP_DATABASE_URL (direct, non-pooler Neon URL) to repository secrets."
            exit 1
          fi
          TIMESTAMP=$(date +%Y-%m-%dT%H-%M-%S)
          FILENAME="elimunova-backup-${TIMESTAMP}.sql"
          # /usr/bin/pg_dump is a wrapper that may still resolve to an older
          # client; pick the newest installed client explicitly so the dump
          # tool major matches (or exceeds) the Neon server major.
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          "$PGBIN/pg_dump" "$DB_URL" \
            --no-owner \
            --no-acl \
            --format=custom \
            --file="${FILENAME}"
          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90

  cleanup:
    name: Clean old backups
    runs-on: ubuntu-latest
    needs: [backup]
    steps:
      - name: Delete backups older than 90 days
        uses: actions/github-script@v7
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.name,
            });
            const cutoff = Date.now() - 90 * 24 * 60 * 60 * 1000;
            for (const artifact of artifacts.artifacts) {
              if (new Date(artifact.created_at).getTime() < cutoff) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.name,
                  artifact_id: artifact.id,
                });
              }
            }
