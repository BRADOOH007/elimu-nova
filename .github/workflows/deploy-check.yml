name: Deploy Check

# Pre-deploy safety net: fail fast on type errors or build failures before
# anything reaches Vercel.
#
# Gate: `typecheck` + `build` (hard failures).
# Lint is non-blocking (continue-on-error) because the repo carries a
# pre-existing backlog of ~1557 errors / ~4891 warnings (mostly
# @typescript-eslint/no-explicit-any and react/no-unescaped-entities). Making
# lint a hard gate would block every deploy until that backlog is cleared.
# Fix the backlog incrementally, then flip `continue-on-error` to false.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://localhost:5432/placeholder' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-test-secret' }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}
      SKIP_ENV_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
