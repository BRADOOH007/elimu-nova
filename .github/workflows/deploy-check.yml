name: Deploy Check

# Pre-deploy safety net: fail fast on type errors or build failures before
# anything reaches Vercel.
#
# Gate: `typecheck` + `build` (hard failures).
# Lint is non-blocking (continue-on-error) because the repo carries a
# pre-existing backlog of ~1557 errors / ~4891 warnings (mostly
# @typescript-eslint/no-explicit-any and react/no-unescaped-entities). Making
# lint a hard gate would block every deploy until that backlog is cleared.
# Fix the backlog incrementally, then flip `continue-on-error` to false.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    env:
      # CI has no local .env; validation in src/lib/env.ts only throws on
      # missing DATABASE_URL / NEXTAUTH_SECRET in production. Provide real
      # values via repo secrets when available, otherwise bypass the check.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      SKIP_ENV_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
